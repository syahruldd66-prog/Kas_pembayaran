<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Rohis Digital - Sistem Cicil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh; color: white;
        }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; }
        .admin-only { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="glass p-8 mb-8 text-center relative overflow-hidden">
            <h1 class="text-3xl font-800 tracking-tighter mb-1 italic">KAS ROHIS <span class="text-pink-500">PRO</span></h1>
            <p class="text-[10px] uppercase tracking-[0.4em] opacity-50">SMKN 1 WAJO • Sistem Manajemen Cicilan</p>
            <button onclick="toggleAdmin()" id="btnAdmin" class="absolute top-4 right-4 bg-white/10 hover:bg-pink-600 px-4 py-2 rounded-full text-[10px] font-bold transition-all">🔐 ADMIN LOGIN</button>
        </div>

        <div id="adminPanel" class="admin-only glass p-6 mb-8 border-yellow-500/30">
            <h3 class="text-yellow-500 font-bold mb-4 text-[10px] uppercase tracking-widest italic">Input Pembayaran / Cicilan</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <select id="nama" class="bg-slate-800 p-3 rounded-xl border border-white/10 outline-none text-white text-sm"></select>
                <input type="number" id="jumlah" placeholder="Nominal Rp (Contoh: 2000)" class="bg-white/5 p-3 rounded-xl border border-white/10 outline-none focus:border-yellow-500 transition text-sm">
                <select id="bulanInput" class="bg-slate-800 p-3 rounded-xl border border-white/10 outline-none text-sm"></select>
                <button onclick="simpanData()" class="bg-yellow-600 hover:bg-yellow-500 transition p-3 rounded-xl font-bold uppercase text-[10px]">Simpan Transaksi</button>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="flex items-center gap-3">
                <select id="filterBulan" onchange="fetchData()" class="bg-pink-600/20 text-pink-400 font-bold p-3 rounded-xl border border-pink-500/30 outline-none cursor-pointer text-sm"></select>
            </div>
            <div class="flex gap-4">
                <div class="glass px-5 py-2 text-[10px] uppercase tracking-wider opacity-70">Target: <span class="text-white font-bold tracking-normal text-sm">Rp 10.000</span></div>
                <div class="glass px-5 py-2 text-[10px] uppercase tracking-wider text-green-400 font-bold">Total Saldo: <span id="totalSaldo" class="text-white tracking-normal text-sm ml-1">Rp 0</span></div>
            </div>
        </div>

        <div class="glass overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-white/5 text-[10px] uppercase tracking-widest text-slate-400">
                            <th class="p-5">Anggota</th>
                            <th class="p-5 text-right">Uang Masuk</th>
                            <th class="p-5 text-center">Status</th>
                            <th class="admin-only p-5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vgU9YBEVrEkEBeAmk_VV9Q_zrM4LsBp';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TARGET_LUNAS = 10000; // Ganti angka ini untuk standar lunasmu
        const DAFTAR_ANGGOTA = ["Aldi Supriadi", "Almira Ramadhani", "Andi Fadhil Rumpang", "Andi Muh Luqman", "Andi Ratu Bilqis", "Andi Syahrul Yudiono", "Anditenrilengka", "Arkan Fikri", "Besse Nurfadillah", "Evi Agnesia", "Febri Aulya Kasunaya", "Fitria", "Melinda Saputri", "Muh Fikran", "Muh Ilham", "Muh. Iqbal", "Muh. Resky Wijaya", "Muhammad Sa'ad Hamzah", "Naswa", "Nur Asmil Hasanah", "Nurul Alifiyatul Aswan", "Nurul Sabila Ramadhani", "Putriani", "Reski Sulistia", "Saskia", "Syahrul", "Yuliana", "Zahrah Rahmadhani", "Muh Fauzan Hidayatullah"].sort();
        const DAFTAR_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let statusAdmin = false;

        function init() {
            const nSelect = document.getElementById('nama');
            const bInput = document.getElementById('bulanInput');
            const bFilter = document.getElementById('filterBulan');
            const currMonth = new Date().getMonth();

            DAFTAR_ANGGOTA.forEach(n => nSelect.innerHTML += `<option value="${n}">${n}</option>`);
            DAFTAR_BULAN.forEach((b, i) => {
                const opt = `<option value="${b}" ${i === currMonth ? 'selected' : ''} class="bg-slate-900">${b}</option>`;
                bInput.innerHTML += opt; bFilter.innerHTML += opt;
            });
        }

        function toggleAdmin() {
            if(!statusAdmin) {
                if(prompt("Password Admin:") === "arulmodss") {
                    statusAdmin = true;
                    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                    document.getElementById('btnAdmin').innerText = "🔓 LOGOUT";
                } else { alert("Salah!"); }
            } else {
                statusAdmin = false;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                document.getElementById('btnAdmin').innerText = "🔐 ADMIN LOGIN";
            }
            fetchData();
        }

        async function fetchData() {
            const bulan = document.getElementById('filterBulan').value;
            const { data, error } = await _supabase.from('kas_pembayaran').select('*').eq('bulan', bulan);
            if (!error) processAndRender(data);
        }

        async function simpanData() {
            const jml = document.getElementById('jumlah').value;
            if (!jml || jml <= 0) return alert("Masukkan jumlah uang!");
            
            const payload = { 
                nama: document.getElementById('nama').value, 
                jumlah: parseInt(jml), 
                bulan: document.getElementById('bulanInput').value 
            };
            const { error } = await _supabase.from('kas_pembayaran').insert([payload]);
            if (error) alert("Error: " + error.message);
            else { document.getElementById('jumlah').value = ''; alert("Data Masuk!"); }
        }

        async function hapusData(id) {
            if(confirm("Hapus transaksi ini?")) {
                await _supabase.from('kas_pembayaran').delete().eq('id', id);
            }
        }

        function processAndRender(rawRecords) {
            const summary = {};
            let totalKasBulanIni = 0;

            // Kelompokkan berdasarkan nama untuk sistem cicil
            rawRecords.forEach(rec => {
                if(!summary[rec.nama]) summary[rec.nama] = { total: 0, ids: [] };
                summary[rec.nama].total += rec.jumlah;
                summary[rec.nama].ids.push(rec.id);
                totalKasBulanIni += rec.jumlah;
            });

            const tbody = document.getElementById('tabelBody');
            tbody.innerHTML = '';

            // Tampilkan daftar semua anggota
            DAFTAR_ANGGOTA.forEach(nama => {
                const dataSiswa = summary[nama] || { total: 0, ids: [] };
                const isLunas = dataSiswa.total >= TARGET_LUNAS;
                const statusColor = dataSiswa.total === 0 ? 'opacity-20' : (isLunas ? 'text-green-400' : 'text-yellow-400');
                const badgeColor = isLunas ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition border-b border-white/5 ${dataSiswa.total === 0 ? 'opacity-40' : ''}">
                        <td class="p-5 font-bold text-slate-200 text-sm">${nama}</td>
                        <td class="p-5 text-right font-mono italic text-sm ${statusColor}">Rp ${dataSiswa.total.toLocaleString()}</td>
                        <td class="p-5 text-center">
                            ${dataSiswa.total > 0 ? `
                                <span class="px-3 py-1 rounded-full text-[8px] font-black border ${badgeColor}">
                                    ${isLunas ? 'LUNAS' : 'NYICIL'}
                                </span>
                            ` : '<span class="text-[8px] opacity-30 tracking-widest font-bold text-red-500">BELUM BAYAR</span>'}
                        </td>
                        <td class="${statusAdmin ? '' : 'hidden'} p-5 text-center">
                            <button onclick="hapusTerakhir('${nama}')" class="text-[9px] font-bold text-red-500 hover:underline">RESET</button>
                        </td>
                    </tr>`;
            });
            document.getElementById('totalSaldo').innerText = `Rp ${totalKasBulanIni.toLocaleString()}`;
        }

        async function hapusTerakhir(nama) {
            if(confirm(`Hapus semua catatan cicilan ${nama} di bulan ini?`)) {
                const bulan = document.getElementById('filterBulan').value;
                await _supabase.from('kas_pembayaran').delete().eq('nama', nama).eq('bulan', bulan);
            }
        }

        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'kas_pembayaran' }, () => fetchData()).subscribe();
        init(); fetchData();
    </script>
</body>
</html>
