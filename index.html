<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Rohis SMKN - Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            min-height: 100vh;
            color: white;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="glass p-6 mb-6 text-center">
            <h1 class="text-2xl font-bold uppercase tracking-widest">Kas Rohis SMKN</h1>
            <p class="text-sm opacity-70">Sistem Pencatatan Kas Real-time</p>
        </div>

        <div class="glass p-6 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" id="nama" placeholder="Nama Siswa" class="bg-white/10 p-2 rounded border border-white/20 focus:outline-none focus:border-pink-500">
            <input type="number" id="jumlah" placeholder="Jumlah (Rp)" class="bg-white/10 p-2 rounded border border-white/20 focus:outline-none focus:border-pink-500">
            <select id="bulanInput" class="bg-white/10 p-2 rounded border border-white/20 text-white">
                <option value="Januari" class="bg-slate-800">Januari</option>
                <option value="Februari" class="bg-slate-800">Februari</option>
                <option value="Maret" class="bg-slate-800">Maret</option>
            </select>
            <button onclick="simpanData()" class="md:col-span-3 bg-pink-600 hover:bg-pink-500 transition p-2 rounded font-bold uppercase">Simpan Pembayaran</button>
        </div>

        <div class="flex justify-between items-center mb-4 px-2">
            <h2 class="text-xl font-semibold" id="labelBulan">Data Kas</h2>
            <select id="filterBulan" onchange="fetchData()" class="bg-white/10 p-1 rounded text-sm">
                <option value="Januari" class="bg-slate-800">Januari</option>
                <option value="Februari" class="bg-slate-800">Februari</option>
                <option value="Maret" class="bg-slate-800">Maret</option>
            </select>
        </div>

        <div class="glass overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-white/10 text-pink-400">
                        <th class="p-4">Nama</th>
                        <th class="p-4 text-center">Bulan</th>
                        <th class="p-4 text-right">Jumlah</th>
                        <th class="p-4 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Konfigurasi Supabase milik Arulmodss
        const SUPABASE_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZmhycnZ2Z2Z4dXp3Y2pnZWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTIyMjMsImV4cCI6MjA5MzcyODIyM30.0WxKal_XVrQt-Mfe9vgRkaZiC_ctiBpGby_64b9z0fA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fungsi Ambil Data dari Tabel 'kas_pembayaran'
        async function fetchData() {
            const bulan = document.getElementById('filterBulan').value;
            const { data, error } = await _supabase
                .from('kas_pembayaran')
                .select('*')
                .eq('bulan', bulan)
                .order('created_at', { ascending: false });

            if (!error) {
                renderTabel(data);
            }
        }

        // Fungsi Simpan Data ke Supabase
        async function simpanData() {
            const nama = document.getElementById('nama').value;
            const jumlah = document.getElementById('jumlah').value;
            const bulan = document.getElementById('bulanInput').value;

            if (!nama || !jumlah) return alert("Isi nama dan jumlah!");

            const { error } = await _supabase
                .from('kas_pembayaran')
                .insert([{ nama, jumlah: parseInt(jumlah), bulan }]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                document.getElementById('nama').value = '';
                document.getElementById('jumlah').value = '';
            }
        }

        // Fungsi Render HTML
        function renderTabel(data) {
            const tbody = document.getElementById('tabelBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = `
                    <tr class="border-b border-white/10 hover:bg-white/5 transition">
                        <td class="p-4 font-medium">${item.nama}</td>
                        <td class="p-4 text-center text-sm opacity-70">${item.bulan}</td>
                        <td class="p-4 text-right font-mono text-green-400">Rp ${item.jumlah.toLocaleString()}</td>
                        <td class="p-4 text-center">
                            <span class="bg-green-500/20 text-green-400 px-2 py-1 rounded-full text-xs font-bold uppercase">Lunas</span>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // LOGIKA REAL-TIME: Mendengar perubahan di database secara langsung
        _supabase
            .channel('any')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'kas_pembayaran' }, (payload) => {
                console.log('Perubahan Data!', payload);
                fetchData(); // Refresh data otomatis tanpa reload
            })
            .subscribe();

        // Jalankan fetch saat pertama kali dibuka
        fetchData();
    </script>
</body>
</html>
