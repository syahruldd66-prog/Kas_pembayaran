<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas & Infaq Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050a09; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 1rem; }
        .mono { font-family: monospace; }
        .jumat-card { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); position: relative; }
        .admin-only { display: none; }
        
        /* Splash Screen Style */
        #splash { 
            position: fixed; inset: 0; background: #050a09; z-index: 100; 
            display: flex; align-items: center; justify-content: center; 
            transition: opacity 0.8s ease;
        }
    </style>
</head>
<body class="p-4 pb-32">

    <div id="splash" onclick="this.style.opacity='0'; setTimeout(()=>this.style.display='none', 800)">
        <div class="text-center">
            <div class="text-6xl mb-6 animate-pulse">🕌</div>
            <h1 class="text-xl font-bold tracking-[0.4em] text-emerald-500 uppercase">Rohis Digital</h1>
            <div class="w-32 h-[1px] bg-emerald-500/30 mx-auto mt-4"></div>
            <p class="text-[8px] opacity-40 mt-4 tracking-widest uppercase">Tap untuk melanjutkan</p>
        </div>
    </div>

    <header class="glass p-6 mb-6 text-center">
        <h1 class="text-xl font-bold uppercase tracking-tighter italic">Laporan <span class="text-emerald-500 text-2xl">Rohis</span></h1>
        <p class="text-[9px] opacity-40 mt-1 tracking-[0.3em]">SMKN 1 WAJO</p>
    </header>

    <div class="mb-6">
        <select id="filter-bulan" onchange="loadData()" class="w-full p-4 rounded-xl bg-emerald-900/30 border border-emerald-500/30 text-white font-bold outline-none"></select>
    </div>

    <div class="mb-8">
        <div class="flex items-center gap-2 mb-3 px-1">
            <div class="w-1 h-4 bg-yellow-500 rounded-full"></div>
            <h3 class="text-xs font-bold text-yellow-500 uppercase tracking-widest">Infaq Jumat Sekolah</h3>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="jumat-card p-4 rounded-2xl text-center">
                <p class="text-[9px] opacity-60 uppercase mb-1">Jumat 1</p>
                <p id="j1" class="text-lg font-bold mono text-yellow-400">0</p>
                <button onclick="hapusKategori('JUMAT1')" class="admin-only absolute top-1 right-2 text-red-500 text-[10px]">✕</button>
            </div>
            <div class="jumat-card p-4 rounded-2xl text-center">
                <p class="text-[9px] opacity-60 uppercase mb-1">Jumat 2</p>
                <p id="j2" class="text-lg font-bold mono text-yellow-400">0</p>
                <button onclick="hapusKategori('JUMAT2')" class="admin-only absolute top-1 right-2 text-red-500 text-[10px]">✕</button>
            </div>
            <div class="jumat-card p-4 rounded-2xl text-center">
                <p class="text-[9px] opacity-60 uppercase mb-1">Jumat 3</p>
                <p id="j3" class="text-lg font-bold mono text-yellow-400">0</p>
                <button onclick="hapusKategori('JUMAT3')" class="admin-only absolute top-1 right-2 text-red-500 text-[10px]">✕</button>
            </div>
            <div class="jumat-card p-4 rounded-2xl text-center">
                <p class="text-[9px] opacity-60 uppercase mb-1">Jumat 4</p>
                <p id="j4" class="text-lg font-bold mono text-yellow-400">0</p>
                <button onclick="hapusKategori('JUMAT4')" class="admin-only absolute top-1 right-2 text-red-500 text-[10px]">✕</button>
            </div>
        </div>
    </div>

    <div class="mb-10">
        <div class="flex items-center gap-2 mb-3 px-1">
            <div class="w-1 h-4 bg-emerald-500 rounded-full"></div>
            <h3 class="text-xs font-bold text-emerald-500 uppercase tracking-widest">Kas Anggota</h3>
        </div>
        <div class="glass overflow-hidden">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-white/5 text-emerald-500/50 uppercase">
                    <tr>
                        <th class="p-4">Nama</th>
                        <th class="p-4 text-right">Total</th>
                        <th class="admin-only p-4 text-center">Hapus</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <button id="btn-lock" onclick="authAdmin()" class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-600 rounded-full shadow-2xl flex items-center justify-center z-40 border-2 border-white/20 text-xl">🔐</button>

    <div id="admin-panel" class="fixed inset-x-0 bottom-0 glass p-6 bg-[#050a09] border-t-2 border-emerald-500/50 hidden z-50 rounded-t-3xl shadow-2xl">
        <div class="flex justify-between items-center mb-5">
            <h2 class="text-xs font-bold uppercase text-emerald-400 italic">Panel Admin</h2>
            <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-500 px-3 py-1 rounded-lg text-[10px] font-bold uppercase">Logout</button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <select id="in-tipe" onchange="checkTipe()" class="bg-white/5 p-4 rounded-xl text-xs border border-white/10 outline-none">
                <option value="KAS">KAS ANGGOTA</option>
                <option value="JUMAT1">INFAQ JUMAT 1</option><option value="JUMAT2">INFAQ JUMAT 2</option>
                <option value="JUMAT3">INFAQ JUMAT 3</option><option value="JUMAT4">INFAQ JUMAT 4</option>
            </select>
            <select id="in-bulan" class="bg-white/5 p-4 rounded-xl text-xs border border-white/10 outline-none"></select>
        </div>
        <select id="in-nama" class="w-full bg-white/5 p-4 rounded-xl text-xs mb-3 border border-white/10 outline-none"></select>
        <input type="number" id="in-jumlah" placeholder="Nominal Rp" class="w-full bg-white/5 p-4 rounded-xl text-xs mb-5 border border-white/10 outline-none">
        <button id="btn-simpan" onclick="simpanKeDatabase()" class="w-full bg-emerald-600 p-4 rounded-2xl font-black text-xs uppercase">Simpan Data</button>
    </div>

    <script>
        const SB_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SB_KEY = 'sb_publishable_vgU9YBEVrEkEBeAmk_VV9Q_zrM4LsBp';
        const _db = supabase.createClient(SB_URL, SB_KEY);

        const ANGGOTA = ["Aldi Supriadi", "Almira Ramadhani", "Andi Fadhil Rumpang", "Andi Muh Luqman", "Andi Ratu Bilqis", "Andi Syahrul Yudiono", "Anditenrilengka", "Arkan Fikri", "Besse Nurfadillah", "Evi Agnesia", "Febri Aulya Kasunaya", "Fitria", "Melinda Saputri", "Muh Fikran", "Muh Ilham", "Muh. Iqbal", "Muh. Resky Wijaya", "Muhammad Sa'ad Hamzah", "Naswa", "Nur Asmil Hasanah", "Nurul Alifiyatul Aswan", "Nurul Sabila Ramadhani", "Putriani", "Reski Sulistia", "Saskia", "Syahrul", "Yuliana", "Zahrah Rahmadhani", "Muh Fauzan Hidayatullah"].sort();
        const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let isAdmin = false;

        window.onload = () => {
            const fMonth = document.getElementById('filter-bulan');
            const iMonth = document.getElementById('in-bulan');
            const iName = document.getElementById('in-nama');
            const now = new Date().getMonth();

            BULAN.forEach((b, i) => {
                const opt = `<option value="${b}">${b}</option>`;
                fMonth.innerHTML += opt; iMonth.innerHTML += opt;
                if(i === now) { fMonth.value = b; iMonth.value = b; }
            });

            ANGGOTA.forEach(n => iName.innerHTML += `<option value="${n}">${n}</option>`);
            
            // Auto hide splash after 3 seconds
            setTimeout(() => {
                const splash = document.getElementById('splash');
                if(splash) splash.style.opacity = '0';
                setTimeout(() => { if(splash) splash.style.display = 'none'; }, 800);
            }, 3000);

            loadData();
        };

        function authAdmin() {
            if(prompt("Password Admin:") === "admin123") {
                isAdmin = true;
                document.getElementById('admin-panel').classList.remove('hidden');
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                loadData();
            } else { alert("Salah!"); }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            loadData();
        }

        function checkTipe() {
            const tipe = document.getElementById('in-tipe').value;
            const nameEl = document.getElementById('in-nama');
            nameEl.disabled = tipe !== "KAS";
            nameEl.style.opacity = tipe !== "KAS" ? "0.2" : "1";
        }

        async function loadData() {
            const bln = document.getElementById('filter-bulan').value;
            const { data, error } = await _db.from('kas_pembayaran').select('*').eq('bulan', bln);
            if(error) return;

            const perOrang = {}, jumat = { JUMAT1:0, JUMAT2:0, JUMAT3:0, JUMAT4:0 };

            data.forEach(r => {
                if(r.kategori === 'KAS' || !r.kategori) {
                    perOrang[r.nama] = (perOrang[r.nama] || 0) + r.jumlah;
                } else if(jumat.hasOwnProperty(r.kategori)) {
                    jumat[r.kategori] += r.jumlah;
                }
            });

            ['j1','j2','j3','j4'].forEach((id, i) => {
                document.getElementById(id).innerText = `Rp ${jumat['JUMAT'+(i+1)].toLocaleString()}`;
            });

            let html = '';
            ANGGOTA.forEach(n => {
                const total = perOrang[n] || 0;
                html += `<tr class="border-b border-white/5">
                    <td class="p-4 font-bold text-slate-300 uppercase text-[9px]">${n}</td>
                    <td class="p-4 text-right mono text-emerald-400 font-bold">Rp ${total.toLocaleString()}</td>
                    <td class="${isAdmin ? '' : 'hidden'} p-4 text-center">
                        <button onclick="hapusSiswa('${n}')" class="text-red-500">🗑</button>
                    </td>
                </tr>`;
            });
            document.getElementById('table-body').innerHTML = html;
            if(isAdmin) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
        }

        async function hapusSiswa(nama) {
            const bln = document.getElementById('filter-bulan').value;
            if(confirm(`Hapus data ${nama}?`)) {
                await _db.from('kas_pembayaran').delete().eq('nama', nama).eq('bulan', bln);
                loadData();
            }
        }

        async function hapusKategori(kat) {
            const bln = document.getElementById('filter-bulan').value;
            if(confirm(`Reset data ${kat}?`)) {
                await _db.from('kas_pembayaran').delete().eq('kategori', kat).eq('bulan', bln);
                loadData();
            }
        }

        async function simpanKeDatabase() {
            const btn = document.getElementById('btn-simpan');
            const jml = document.getElementById('in-jumlah').value;
            const tipe = document.getElementById('in-tipe').value;
            if(!jml) return;
            
            btn.innerText = "WAIT...";
            btn.disabled = true;

            const payload = {
                nama: tipe === 'KAS' ? document.getElementById('in-nama').value : 'SISWA_SEKOLAH',
                jumlah: parseInt(jml),
                bulan: document.getElementById('in-bulan').value,
                kategori: tipe
            };

            await _db.from('kas_pembayaran').insert([payload]);
            document.getElementById('in-jumlah').value = '';
            await loadData();
            
            btn.innerText = "Simpan Data";
            btn.disabled = false;
        }
    </script>
</body>
</html>
