<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Rohis Pro - Emerald Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #06110e; /* Darker Green Background */
            color: white; min-height: 100vh; overflow-x: hidden;
            perspective: 1000px;
        }

        /* Glassmorphism Hijau */
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(52, 211, 153, 0.1); 
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass:hover { 
            border-color: rgba(52, 211, 153, 0.4); 
            box-shadow: 0 0 25px rgba(52, 211, 153, 0.1); 
        }

        /* Splash Screen 3D Emerald */
        #welcome-screen {
            position: fixed; inset: 0; background: #06110e; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .logo-3d {
            font-size: 80px;
            animation: spin3d 4s infinite linear;
            transform-style: preserve-3d;
            filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.5));
        }
        @keyframes spin3d {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .welcome-text {
            font-size: 1.8rem; font-weight: 800; letter-spacing: 0.2em;
            background: linear-gradient(to right, #10b981, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Floating Background */
        .icon-element {
            position: absolute; opacity: 0.07; font-size: 2rem;
            animation: float 15s infinite linear; pointer-events: none; z-index: -1;
            color: #34d399;
        }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Mobile Safe Animation */
        @keyframes floatMobile {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hidden-screen { opacity: 0; visibility: hidden; }
        .admin-only { display: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="welcome-screen">
        <div class="logo-3d mb-8 text-emerald-400">🕌</div>
        <h2 class="welcome-text mb-2">ASSALAMUALAIKUM</h2>
        <div class="glass p-4 border-emerald-500/20 max-w-xs mx-auto mb-6 text-center">
            <p class="text-xs italic text-emerald-300">"Sedekah tidaklah mengurangi harta. Yuk, lunasin kas hari ini!"</p>
        </div>
        <div class="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 w-full origin-left animate-[loading_3s_ease-in-out]"></div>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none z-[-1]">
        <span class="icon-element" style="left: 10%; animation-delay: 0s;">🌙</span>
        <span class="icon-element" style="left: 40%; animation-delay: 5s;">⭐</span>
        <span class="icon-element" style="left: 70%; animation-delay: 2s;">🕌</span>
        <span class="icon-element" style="left: 90%; animation-delay: 8s;">✨</span>
    </div>

    <div id="main-content" class="max-w-5xl mx-auto transition-transform duration-500 ease-out">
        <div class="glass p-8 mb-6 text-center relative overflow-hidden border-emerald-500/10">
            <h1 class="text-3xl font-800 tracking-tighter mb-1 italic">KAS ROHIS <span class="text-emerald-400">GREEN</span></h1>
            <p class="text-[10px] uppercase tracking-[0.4em] opacity-40 text-emerald-100">Digital Financial SMKN 1 WAJO</p>
            <button onclick="toggleAdmin()" id="btnAdmin" class="absolute top-4 right-4 bg-emerald-500/10 hover:bg-emerald-600 px-4 py-2 rounded-full text-[10px] font-bold transition-all border border-emerald-500/20">🔐 ADMIN</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="glass p-6 border-emerald-500/20">
                <p class="text-[9px] font-bold text-emerald-400 tracking-widest mb-3 uppercase text-center">Transfer Dana</p>
                <div class="bg-emerald-600/20 border border-emerald-500/30 p-4 rounded-2xl text-center">
                    <p class="text-2xl font-800 tracking-wider">0822 9379 5296</p>
                    <p class="text-[10px] opacity-60 uppercase mt-1">Syahrul (Bendahara)</p>
                </div>
            </div>
            <div class="glass p-6 border-emerald-500/20 flex flex-col items-center">
                <p class="text-[9px] font-bold text-emerald-400 tracking-widest mb-3 uppercase">QRIS Payment</p>
                <div class="w-24 h-24 bg-white/5 border-2 border-dashed border-emerald-500/20 rounded-xl flex items-center justify-center">
                    <span class="text-[8px] opacity-40 uppercase">Scan Me</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <select id="filterBulan" onchange="fetchData()" class="bg-emerald-600 text-white font-bold p-3 rounded-xl outline-none text-sm w-full md:w-auto cursor-pointer"></select>
            <div class="flex gap-4">
                <div class="glass px-5 py-2 text-[10px] uppercase border-emerald-500/10">Target: <b class="text-emerald-400">Rp 10k</b></div>
                <div class="glass px-5 py-2 text-[10px] uppercase border-emerald-500/20">Saldo: <span id="totalSaldo" class="text-emerald-400 font-bold text-sm">Rp 0</span></div>
            </div>
        </div>

        <div class="glass overflow-hidden shadow-2xl mb-24 border-emerald-500/10">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-emerald-500/5 text-[10px] uppercase tracking-widest text-emerald-400/60">
                            <th class="p-5">Anggota Rohis</th>
                            <th class="p-5 text-right">Uang Masuk</th>
                            <th class="p-5 text-center">Status</th>
                            <th class="admin-only p-5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loginOverlay" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[110] hidden items-center justify-center">
        <div class="glass p-8 w-80 border-emerald-500/50">
            <h2 class="text-center font-bold mb-4 text-emerald-400 italic">🔐 VERIFIKASI ADMIN</h2>
            <input type="password" id="passInput" class="w-full bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 outline-none focus:border-emerald-500 mb-4 text-center">
            <div class="flex gap-2">
                <button onclick="toggleAdmin()" class="flex-1 bg-white/5 p-2 rounded-xl text-[10px] font-bold">BATAL</button>
                <button onclick="checkLogin()" class="flex-1 bg-emerald-600 p-2 rounded-xl text-[10px] font-bold">MASUK</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="admin-only fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-4xl glass p-4 border-emerald-500/40 bg-[#06110e]/90 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-50">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <select id="nama" class="bg-emerald-900/50 p-2 rounded-lg text-xs outline-none border border-emerald-500/20"></select>
            <input type="number" id="jumlah" placeholder="Nominal Rp" class="bg-white/5 p-2 rounded-lg text-xs outline-none border border-white/10">
            <select id="bulanInput" class="bg-emerald-900/50 p-2 rounded-lg text-xs outline-none border border-emerald-500/20"></select>
            <button onclick="simpanData()" class="bg-emerald-600 hover:bg-emerald-500 p-2 rounded-lg font-bold text-[10px] uppercase">Simpan</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vgU9YBEVrEkEBeAmk_VV9Q_zrM4LsBp';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TARGET_LUNAS = 10000;
        const DAFTAR_ANGGOTA = ["Aldi Supriadi", "Almira Ramadhani", "Andi Fadhil Rumpang", "Andi Muh Luqman", "Andi Ratu Bilqis", "Andi Syahrul Yudiono", "Anditenrilengka", "Arkan Fikri", "Besse Nurfadillah", "Evi Agnesia", "Febri Aulya Kasunaya", "Fitria", "Melinda Saputri", "Muh Fikran", "Muh Ilham", "Muh. Iqbal", "Muh. Resky Wijaya", "Muhammad Sa'ad Hamzah", "Naswa", "Nur Asmil Hasanah", "Nurul Alifiyatul Aswan", "Nurul Sabila Ramadhani", "Putriani", "Reski Sulistia", "Saskia", "Syahrul", "Yuliana", "Zahrah Rahmadhani", "Muh Fauzan Hidayatullah"].sort();
        const DAFTAR_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let statusAdmin = false;

        function init() {
            const nSelect = document.getElementById('nama');
            const bInput = document.getElementById('bulanInput');
            const bFilter = document.getElementById('filterBulan');
            const currMonth = new Date().getMonth();

            DAFTAR_ANGGOTA.forEach(n => nSelect.innerHTML += `<option value="${n}">${n}</option>`);
            DAFTAR_BULAN.forEach((b, i) => {
                const opt = `<option value="${b}" ${i === currMonth ? 'selected' : ''} class="bg-slate-900">${b}</option>`;
                bInput.innerHTML += opt; bFilter.innerHTML += opt;
            });
            
            // Welcome Screen logic
            setTimeout(() => {
                document.getElementById('welcome-screen').classList.add('hidden-screen');
            }, 3000);

            // 3D Motion (Hanya Laptop/PC)
            if (window.innerWidth > 1024) {
                document.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                    document.getElementById('main-content').style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });
            } else {
                document.getElementById('main-content').style.animation = "floatMobile 4s ease-in-out infinite";
            }
        }

        function toggleAdmin() {
            if (!statusAdmin) { document.getElementById('loginOverlay').style.display = 'flex'; }
            else { 
                statusAdmin = false; 
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                document.getElementById('btnAdmin').innerText = "🔐 ADMIN";
            }
        }

        function checkLogin() {
            if (document.getElementById('passInput').value === "admin123") {
                statusAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                document.getElementById('btnAdmin').innerText = "🔓 LOGOUT";
                document.getElementById('loginOverlay').style.display = 'none';
                fetchData();
            } else { alert("Password Salah!"); }
        }

        async function fetchData() {
            const bulan = document.getElementById('filterBulan').value;
            const { data, error } = await _supabase.from('kas_pembayaran').select('*').eq('bulan', bulan);
            if (!error) processAndRender(data);
        }

        async function simpanData() {
            const payload = { 
                nama: document.getElementById('nama').value, 
                jumlah: parseInt(document.getElementById('jumlah').value), 
                bulan: document.getElementById('bulanInput').value 
            };
            const { error } = await _supabase.from('kas_pembayaran').insert([payload]);
            if (!error) { alert("Tercatat!"); fetchData(); document.getElementById('jumlah').value = ''; }
        }

        function processAndRender(rawRecords) {
            const summary = {}; let total = 0;
            rawRecords.forEach(rec => {
                if(!summary[rec.nama]) summary[rec.nama] = { total: 0 };
                summary[rec.nama].total += rec.jumlah; total += rec.jumlah;
            });

            document.getElementById('totalSaldo').innerText = `Rp ${total.toLocaleString()}`;
            const tbody = document.getElementById('tabelBody'); tbody.innerHTML = '';

            DAFTAR_ANGGOTA.forEach(nama => {
                const d = summary[nama] || { total: 0 };
                const isLunas = d.total >= TARGET_LUNAS;
                const statusText = isLunas ? 'LUNAS' : (d.total > 0 ? 'CICIL' : 'BELUM');
                const colorClass = isLunas ? 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5' : (d.total > 0 ? 'text-yellow-400 border-yellow-500/20 bg-yellow-500/5' : 'text-red-400 border-red-500/20 bg-red-500/5');
                
                tbody.innerHTML += `
                    <tr class="${d.total === 0 ? 'opacity-30' : ''}">
                        <td class="p-5 font-bold text-xs">${nama}</td>
                        <td class="p-5 text-right font-mono text-xs text-emerald-200">Rp ${d.total.toLocaleString()}</td>
                        <td class="p-5 text-center">
                            <span class="px-3 py-1 rounded-full text-[7px] font-black border ${colorClass}">${statusText}</span>
                        </td>
                        <td class="${statusAdmin ? '' : 'hidden'} p-5 text-center">
                            <button onclick="hapusSiswa('${nama}')" class="text-red-500 text-[9px] font-bold">RESET</button>
                        </td>
                    </tr>`;
            });
        }

        async function hapusSiswa(nama) {
            if(confirm(`Reset data ${nama}?`)) {
                await _supabase.from('kas_pembayaran').delete().eq('nama', nama).eq('bulan', document.getElementById('filterBulan').value);
                fetchData();
            }
        }

        init(); fetchData();
    </script>
</body>
</html>
