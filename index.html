<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas & Infaq Rohis Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #06110e; color: white; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(52, 211, 153, 0.12); border-radius: 1.5rem; }
        #welcome-screen { position: fixed; inset: 0; background: #06110e; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s; }
        .logo-3d { font-size: 60px; animation: spin 8s infinite linear; }
        @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .hidden-screen { opacity: 0; visibility: hidden; }
        .admin-only { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="welcome-screen">
        <div class="logo-3d mb-4">🕌</div>
        <h2 class="text-xl font-800 tracking-[0.3em] text-emerald-400 uppercase">Arul Modss</h2>
        <p class="text-[10px] opacity-40 mt-2">Menghubungkan ke Database...</p>
    </div>

    <div id="main-content" class="max-w-5xl mx-auto">
        <div class="glass p-6 mb-6 text-center relative">
            <h1 class="text-2xl font-800 italic uppercase">Keuangan <span class="text-emerald-400">Rohis</span></h1>
            <button onclick="toggleAdmin()" id="btnAdmin" class="absolute top-4 right-4 bg-emerald-500/10 px-3 py-1 rounded-full text-[10px] font-bold border border-emerald-500/20">🔐 ADMIN</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="glass p-4 text-center border-emerald-500/20">
                <p class="text-[8px] uppercase opacity-50">Kas Anggota</p>
                <p id="totalSaldo" class="text-lg font-bold text-emerald-400 text-sm">Rp 0</p>
            </div>
            <div class="glass p-4 text-center border-yellow-500/20">
                <p class="text-[8px] uppercase opacity-50">Infaq Sekolah</p>
                <p id="totalInfaq" class="text-lg font-bold text-yellow-400 text-sm">Rp 0</p>
            </div>
        </div>

        <select id="filterBulan" onchange="fetchData()" class="bg-emerald-600 text-white font-bold p-3 rounded-xl text-sm w-full mb-6 outline-none"></select>

        <div class="mb-8">
            <h3 class="text-[10px] font-black tracking-widest text-yellow-500 uppercase mb-3">🕌 Infaq Per Jumat</h3>
            <div class="glass grid grid-cols-4 divide-x divide-white/5 text-center">
                <div class="p-4"><p class="text-[7px] opacity-40">J-1</p><p id="j1-val" class="text-xs font-mono">0</p></div>
                <div class="p-4"><p class="text-[7px] opacity-40">J-2</p><p id="j2-val" class="text-xs font-mono">0</p></div>
                <div class="p-4"><p class="text-[7px] opacity-40">J-3</p><p id="j3-val" class="text-xs font-mono">0</p></div>
                <div class="p-4"><p class="text-[7px] opacity-40">J-4</p><p id="j4-val" class="text-xs font-mono">0</p></div>
            </div>
        </div>

        <div class="mb-20 glass overflow-hidden">
            <table class="w-full text-left text-[11px]">
                <thead class="bg-emerald-500/5 text-emerald-400/50 uppercase">
                    <tr><th class="p-4">Nama Anggota</th><th class="p-4 text-right">Total</th><th class="p-4 text-center">Status</th><th class="admin-only p-4"></th></tr>
                </thead>
                <tbody id="tabelBody" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </div>

    <div id="adminPanel" class="admin-only fixed bottom-4 left-1/2 -translate-x-1/2 w-[95%] glass p-4 bg-[#06110e] shadow-2xl z-50 border-emerald-500/40">
        <div class="grid grid-cols-2 gap-2 mb-2">
            <select id="tipe" onchange="toggleNamaInput()" class="bg-emerald-900/40 p-2 rounded-lg text-[10px] border border-emerald-500/20 text-emerald-400 font-bold">
                <option value="KAS">KAS ANGGOTA</option>
                <option value="JUMAT1">JUMAT 1</option><option value="JUMAT2">JUMAT 2</option>
                <option value="JUMAT3">JUMAT 3</option><option value="JUMAT4">JUMAT 4</option>
            </select>
            <select id="bulanInput" class="bg-emerald-900/40 p-2 rounded-lg text-[10px] border border-emerald-500/20"></select>
        </div>
        <select id="nama" class="w-full bg-emerald-900/40 p-2 rounded-lg text-[10px] border border-emerald-500/20 mb-2"></select>
        <div class="flex gap-2">
            <input type="number" id="jumlah" placeholder="Nominal Rp" class="flex-1 bg-white/5 p-2 rounded-lg text-[10px] border border-white/10 outline-none">
            <button id="btnSimpan" onclick="simpanData()" class="bg-emerald-600 px-6 py-2 rounded-lg font-bold text-[10px] uppercase">Simpan</button>
        </div>
    </div>

    <div id="loginOverlay" class="fixed inset-0 bg-black/95 z-[110] hidden items-center justify-center p-4">
        <div class="glass p-6 w-full max-w-xs border-emerald-500/50">
            <h2 class="text-center font-bold mb-4 text-emerald-400 text-[10px] uppercase tracking-widest">Login Pengurus</h2>
            <input type="password" id="passInput" class="w-full bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 outline-none mb-4 text-center">
            <div class="flex gap-2">
                <button onclick="toggleAdmin()" class="flex-1 bg-white/5 p-2 rounded-lg text-[10px] uppercase">Batal</button>
                <button onclick="checkLogin()" class="flex-1 bg-emerald-600 p-2 rounded-lg text-[10px] uppercase">Masuk</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_vgU9YBEVrEkEBeAmk_VV9Q_zrM4LsBp';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DAFTAR_ANGGOTA = ["Aldi Supriadi", "Almira Ramadhani", "Andi Fadhil Rumpang", "Andi Muh Luqman", "Andi Ratu Bilqis", "Andi Syahrul Yudiono", "Anditenrilengka", "Arkan Fikri", "Besse Nurfadillah", "Evi Agnesia", "Febri Aulya Kasunaya", "Fitria", "Melinda Saputri", "Muh Fikran", "Muh Ilham", "Muh. Iqbal", "Muh. Resky Wijaya", "Muhammad Sa'ad Hamzah", "Naswa", "Nur Asmil Hasanah", "Nurul Alifiyatul Aswan", "Nurul Sabila Ramadhani", "Putriani", "Reski Sulistia", "Saskia", "Syahrul", "Yuliana", "Zahrah Rahmadhani", "Muh Fauzan Hidayatullah"].sort();
        const DAFTAR_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let statusAdmin = false;

        function init() {
            const nSelect = document.getElementById('nama');
            const bInput = document.getElementById('bulanInput');
            const bFilter = document.getElementById('filterBulan');
            const currMonth = new Date().getMonth();

            DAFTAR_ANGGOTA.forEach(n => nSelect.innerHTML += `<option value="${n}">${n}</option>`);
            DAFTAR_BULAN.forEach((b, i) => {
                const opt = `<option value="${b}" ${i === currMonth ? 'selected' : ''}>${b}</option>`;
                bInput.innerHTML += opt; bFilter.innerHTML += opt;
            });
            
            setTimeout(() => { document.getElementById('welcome-screen').classList.add('hidden-screen'); }, 3000);
            fetchData();
        }

        function toggleNamaInput() {
            const tipe = document.getElementById('tipe').value;
            const nSelect = document.getElementById('nama');
            nSelect.disabled = tipe !== "KAS";
            nSelect.style.opacity = tipe !== "KAS" ? "0.3" : "1";
        }

        function toggleAdmin() {
            if (!statusAdmin) { document.getElementById('loginOverlay').style.display = 'flex'; }
            else { 
                statusAdmin = false; 
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
                document.getElementById('btnAdmin').innerText = "🔐 ADMIN";
            }
        }

        function checkLogin() {
            if (document.getElementById('passInput').value === "admin123") {
                statusAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                document.getElementById('btnAdmin').innerText = "🔓 LOGOUT";
                document.getElementById('loginOverlay').style.display = 'none';
                fetchData();
            } else { alert("Salah!"); }
        }

        async function fetchData() {
            const bulan = document.getElementById('filterBulan').value;
            const { data, error } = await _supabase.from('kas_pembayaran').select('*').eq('bulan', bulan);
            if (error) { console.error("Fetch Error:", error); return; }
            processAndRender(data);
        }

        async function simpanData() {
            const btn = document.getElementById('btnSimpan');
            const nominal = document.getElementById('jumlah').value;
            const tipe = document.getElementById('tipe').value;
            
            if (!nominal || nominal <= 0) { alert("Isi nominal dulu!"); return; }

            // Ubah tombol jadi loading
            btn.innerText = "WAIT...";
            btn.disabled = true;

            const payload = { 
                nama: tipe === "KAS" ? document.getElementById('nama').value : "GLOBAL_SISWA", 
                jumlah: parseInt(nominal), 
                bulan: document.getElementById('bulanInput').value,
                kategori: tipe 
            };

            try {
                const { data, error } = await _supabase.from('kas_pembayaran').insert([payload]);
                if (error) {
                    console.error("Supabase Insert Error:", error);
                    alert("Error: " + error.message + "\nPastikan sudah tambah kolom 'kategori' di Supabase.");
                } else {
                    alert("Berhasil disimpan!");
                    document.getElementById('jumlah').value = '';
                    await fetchData();
                }
            } catch (err) {
                alert("Kesalahan Jaringan!");
            } finally {
                btn.innerText = "SIMPAN";
                btn.disabled = false;
            }
        }

        function processAndRender(raw) {
            let tKas = 0; let tInfaq = 0;
            const kasOrang = {};
            const infaqJumat = { JUMAT1: 0, JUMAT2: 0, JUMAT3: 0, JUMAT4: 0 };

            raw.forEach(r => {
                if (r.kategori === 'KAS' || !r.kategori) {
                    kasOrang[r.nama] = (kasOrang[r.nama] || 0) + r.jumlah;
                    tKas += r.jumlah;
                } else {
                    infaqJumat[r.kategori] += r.jumlah;
                    tInfaq += r.jumlah;
                }
            });

            document.getElementById('totalSaldo').innerText = `Rp ${tKas.toLocaleString()}`;
            document.getElementById('totalInfaq').innerText = `Rp ${tInfaq.toLocaleString()}`;
            document.getElementById('j1-val').innerText = tInfaq === 0 ? "0" : infaqJumat.JUMAT1.toLocaleString();
            document.getElementById('j2-val').innerText = tInfaq === 0 ? "0" : infaqJumat.JUMAT2.toLocaleString();
            document.getElementById('j3-val').innerText = tInfaq === 0 ? "0" : infaqJumat.JUMAT3.toLocaleString();
            document.getElementById('j4-val').innerText = tInfaq === 0 ? "0" : infaqJumat.JUMAT4.toLocaleString();

            const tBody = document.getElementById('tabelBody'); tBody.innerHTML = '';
            DAFTAR_ANGGOTA.forEach(nama => {
                const total = kasOrang[nama] || 0;
                const badge = total >= 10000 ? 'LUNAS' : (total > 0 ? 'CICIL' : 'BELUM');
                const bStyle = total >= 10000 ? 'text-emerald-400' : (total > 0 ? 'text-yellow-400' : 'text-red-400');
                
                tBody.innerHTML += `<tr>
                    <td class="p-4 font-bold">${nama}</td>
                    <td class="p-4 text-right">Rp ${total.toLocaleString()}</td>
                    <td class="p-4 text-center"><span class="${bStyle}">${badge}</span></td>
                    <td class="${statusAdmin ? '' : 'hidden'} p-4 text-center"><button onclick="hapusSiswa('${nama}')">🗑️</button></td>
                </tr>`;
            });
        }

        async function hapusSiswa(nama) {
            if(confirm(`Hapus data ${nama}?`)) {
                await _supabase.from('kas_pembayaran').delete().eq('nama', nama).eq('bulan', document.getElementById('filterBulan').value);
                fetchData();
            }
        }

        init();
    </script>
</body>
</html>
