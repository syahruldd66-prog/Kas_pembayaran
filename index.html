<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Rohis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050a09; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 1rem; }
        .j-card { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
        .admin-only { display: none; }
        #modal-input { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="p-4 pb-24">

    <div id="splash" onclick="this.remove()" class="fixed inset-0 bg-[#050a09] z-[110] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-6xl mb-4">🕌</div>
        <h1 class="text-xl font-bold tracking-widest text-emerald-500 uppercase">Rohis Digital</h1>
        <p class="text-[8px] opacity-40 mt-4 uppercase">Ketuk untuk masuk</p>
    </div>

    <header class="text-center mb-6 pt-4">
        <h1 class="text-2xl font-black text-emerald-500 italic">LAPORAN <span class="text-white">KAS</span></h1>
        <p class="text-[9px] opacity-50 tracking-[0.3em]">SMKN 1 WAJO</p>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="glass p-4 text-center border-emerald-500/50">
            <p class="text-[8px] opacity-50 uppercase mb-1">Total Kas Masuk</p>
            <p id="t-kas" class="text-lg font-bold text-emerald-400 font-mono italic">Rp 0</p>
        </div>
        <div class="glass p-4 text-center border-yellow-500/30">
            <p class="text-[8px] opacity-50 uppercase mb-1">Total Infaq Sekolah</p>
            <p id="t-infaq" class="text-lg font-bold text-yellow-500 font-mono italic">Rp 0</p>
        </div>
    </div>

    <div class="mb-6">
        <select id="f-bulan" onchange="loadData()" class="w-full bg-emerald-900/20 p-3 rounded-xl border border-emerald-500/30 text-sm font-bold outline-none"></select>
    </div>

    <div class="grid grid-cols-4 gap-2 mb-8">
        <div class="j-card p-3 rounded-xl text-center relative border-yellow-500/20">
            <p class="text-[7px] opacity-50 uppercase">J-1</p><p id="j1" class="text-[10px] font-bold text-yellow-500">0</p>
            <button onclick="hapusKat('JUMAT1')" class="admin-only absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px]">✕</button>
        </div>
        <div class="j-card p-3 rounded-xl text-center relative border-yellow-500/20">
            <p class="text-[7px] opacity-50 uppercase">J-2</p><p id="j2" class="text-[10px] font-bold text-yellow-500">0</p>
            <button onclick="hapusKat('JUMAT2')" class="admin-only absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px]">✕</button>
        </div>
        <div class="j-card p-3 rounded-xl text-center relative border-yellow-500/20">
            <p class="text-[7px] opacity-50 uppercase">J-3</p><p id="j3" class="text-[10px] font-bold text-yellow-500">0</p>
            <button onclick="hapusKat('JUMAT3')" class="admin-only absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px]">✕</button>
        </div>
        <div class="j-card p-3 rounded-xl text-center relative border-yellow-500/20">
            <p class="text-[7px] opacity-50 uppercase">J-4</p><p id="j4" class="text-[10px] font-bold text-yellow-500">0</p>
            <button onclick="hapusKat('JUMAT4')" class="admin-only absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px]">✕</button>
        </div>
    </div>

    <div class="glass overflow-hidden mb-4">
        <table class="w-full text-[11px]">
            <thead class="bg-emerald-500/10 text-emerald-500 font-bold uppercase">
                <tr><th class="p-4 text-left">Daftar Anggota</th><th class="p-4 text-right">Saldo</th><th class="admin-only p-4"></th></tr>
            </thead>
            <tbody id="isi-tabel" class="divide-y divide-white/5"></tbody>
            <tfoot class="bg-emerald-500/20">
                <tr class="font-black text-emerald-400">
                    <td class="p-4 text-left">TOTAL KESELURUHAN</td>
                    <td id="foot-total" class="p-4 text-right font-mono italic underline">Rp 0</td>
                    <td class="admin-only"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <button onclick="showAdmin()" class="fixed bottom-6 right-6 w-14 h-14 bg-emerald-600 rounded-full shadow-2xl flex items-center justify-center z-50 text-xl border-2 border-white/20">🔐</button>

    <div id="modal-input">
        <div class="glass bg-[#050a09] w-full max-w-sm p-6 border-2 border-emerald-500/50 relative">
            <div class="flex justify-between mb-6">
                <h2 class="text-xs font-bold text-emerald-400 tracking-widest uppercase italic">Input Data Rohis</h2>
                <button onclick="hideAdmin()" class="text-red-500 text-xs font-bold">TUTUP</button>
            </div>
            <select id="i-tipe" onchange="cekTipe()" class="w-full bg-white/5 p-4 rounded-xl mb-3 text-xs border border-white/10 outline-none"></select>
            <select id="i-nama" class="w-full bg-white/5 p-4 rounded-xl mb-3 text-xs border border-white/10 outline-none"></select>
            <input type="number" id="i-jml" placeholder="Nominal Rp (Misal: 10000)" class="w-full bg-white/5 p-4 rounded-xl mb-6 text-xs border border-white/10 outline-none focus:border-emerald-500">
            <button onclick="gasSimpan()" id="btn-save" class="w-full bg-emerald-600 p-4 rounded-xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">SIMPAN LAPORAN</button>
        </div>
    </div>

    <script>
        const SB_URL = 'https://rkfhrrvvgfxuzwcjgekb.supabase.co';
        const SB_KEY = 'sb_publishable_vgU9YBEVrEkEBeAmk_VV9Q_zrM4LsBp';
        const _db = supabase.createClient(SB_URL, SB_KEY);

        const LIST_NAMA = ["Aldi Supriadi", "Almira Ramadhani", "Andi Fadhil Rumpang", "Andi Muh Luqman", "Andi Ratu Bilqis", "Andi Syahrul Yudiono", "Anditenrilengka", "Arkan Fikri", "Besse Nurfadillah", "Evi Agnesia", "Febri Aulya Kasunaya", "Fitria", "Melinda Saputri", "Muh Fikran", "Muh Ilham", "Muh. Iqbal", "Muh. Resky Wijaya", "Muhammad Sa'ad Hamzah", "Naswa", "Nur Asmil Hasanah", "Nurul Alifiyatul Aswan", "Nurul Sabila Ramadhani", "Putriani", "Reski Sulistia", "Saskia", "Syahrul", "Yuliana", "Zahrah Rahmadhani", "Muh Fauzan Hidayatullah"].sort();
        const LIST_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let isAdm = false;

        window.onload = () => {
            const f = document.getElementById('f-bulan');
            const it = document.getElementById('i-tipe');
            const inama = document.getElementById('i-nama');
            const bln = new Date().getMonth();

            LIST_BULAN.forEach((b) => { f.innerHTML += `<option value="${b}">${b}</option>`; });
            f.value = LIST_BULAN[bln];

            it.innerHTML = `<option value="KAS">KAS ANGGOTA</option><option value="JUMAT1">JUMAT 1</option><option value="JUMAT2">JUMAT 2</option><option value="JUMAT3">JUMAT 3</option><option value="JUMAT4">JUMAT 4</option>`;
            LIST_NAMA.forEach(n => inama.innerHTML += `<option value="${n}">${n}</option>`);
            
            setTimeout(() => { if(document.getElementById('splash')) document.getElementById('splash').remove(); }, 3000);
            loadData();
        };

        function showAdmin() {
            if(isAdm) { document.getElementById('modal-input').style.display = 'flex'; }
            else if(prompt("Sandi Petugas:") === "admin123") {
                isAdm = true;
                document.getElementById('modal-input').style.display = 'flex';
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'table-cell');
                loadData();
            }
        }
        function hideAdmin() { document.getElementById('modal-input').style.display = 'none'; }
        function cekTipe() { document.getElementById('i-nama').disabled = document.getElementById('i-tipe').value !== 'KAS'; }

        async function loadData() {
            const bln = document.getElementById('f-bulan').value;
            const { data, error } = await _db.from('kas_pembayaran').select('*').eq('bulan', bln);
            if(error) return;

            let tk = 0, ti = 0;
            const perNama = {}, jum = { JUMAT1:0, JUMAT2:0, JUMAT3:0, JUMAT4:0 };

            data.forEach(r => {
                const k = (r.kategori || 'KAS').toUpperCase();
                if(k === 'KAS') { perNama[r.nama] = (perNama[r.nama] || 0) + r.jumlah; tk += r.jumlah; }
                else if(jum.hasOwnProperty(k)) { jum[k] += r.jumlah; ti += r.jumlah; }
            });

            document.getElementById('t-kas').innerText = 'Rp ' + tk.toLocaleString();
            document.getElementById('t-infaq').innerText = 'Rp ' + ti.toLocaleString();
            document.getElementById('foot-total').innerText = 'Rp ' + tk.toLocaleString();
            ['j1','j2','j3','j4'].forEach((id, i) => { document.getElementById(id).innerText = jum['JUMAT'+(i+1)].toLocaleString(); });

            let h = '';
            LIST_NAMA.forEach(n => {
                const sld = perNama[n] || 0;
                h += `<tr class="border-b border-white/5">
                    <td class="p-4 uppercase text-[9px] font-bold text-slate-300">${n}</td>
                    <td class="p-4 text-right text-emerald-400 font-mono font-bold">Rp ${sld.toLocaleString()}</td>
                    <td class="p-4 text-center ${isAdm?'':'hidden'}"><button onclick="delSiswa('${n}')" class="text-red-500 font-bold">🗑</button></td>
                </tr>`;
            });
            document.getElementById('isi-tabel').innerHTML = h;
        }

        async function gasSimpan() {
            const jml = document.getElementById('i-jml').value;
            const tipe = document.getElementById('i-tipe').value;
            if(!jml || jml <= 0) return alert("Masukkan jumlah uang!");
            
            document.getElementById('btn-save').innerText = 'PROSES...';
            const payload = { nama: tipe==='KAS'?document.getElementById('i-nama').value:'GLOBAL_SEKOLAH', jumlah: parseInt(jml), bulan: document.getElementById('f-bulan').value, kategori: tipe };
            
            await _db.from('kas_pembayaran').insert([payload]);
            document.getElementById('i-jml').value = '';
            hideAdmin();
            loadData();
            document.getElementById('btn-save').innerText = 'SIMPAN LAPORAN';
        }

        async function delSiswa(n) { if(confirm(`Hapus semua data kas ${n} di bulan ini?`)) { await _db.from('kas_pembayaran').delete().eq('nama', n).eq('bulan', document.getElementById('f-bulan').value); loadData(); } }
        async function hapusKat(k) { if(confirm(`Hapus data ${k} di bulan ini?`)) { await _db.from('kas_pembayaran').delete().eq('kategori', k).eq('bulan', document.getElementById('f-bulan').value); loadData(); } }
    </script>
</body>
</html>
